# The Arpit Jain Best Researcher Scholarship (AJBRS) website, https://scholarship.arpit-jain.com
# Plain Jekyll on GitHub Pages: one layout (_layouts/default.html), the papers in _data/recipients.yml.

title: Arpit Jain Best Researcher Scholarship (AJBRS)
description: A yearly award for the best research published by students of the School of Computer Engineering at Manipal Institute of Technology.
url: https://scholarship.arpit-jain.com
baseurl: ""

# Each awarded paper's prize, in rupees. The home page multiplies it by the number of papers.
award_per_paper: 10000

nav:
  - {title: Recipients, url: /recipients/}
  - {title: How to apply, url: /how-to-apply/}
  - {title: Contact, url: /contact/}

# Google Analytics; only in production builds (GitHub Pages builds with JEKYLL_ENV=production).
gtag: G-HT3T6XCVQK

markdown: kramdown
timezone: Asia/Kolkata

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  - scope: {path: ""}
    values: {layout: default}

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor/
